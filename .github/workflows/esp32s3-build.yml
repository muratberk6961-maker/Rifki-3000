name: XiaoZhi ESP32-S3 Gercek Derleme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: XiaoZhi kaynak kodunu indir
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          path: xiaozhi

      - name: ESP32-S3 derle
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi
          idf.py set-target esp32s3
          idf.py build
