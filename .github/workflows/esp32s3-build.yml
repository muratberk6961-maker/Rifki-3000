name: RIFKI v15.4 + XiaoZhi ESP32-S3 Entegrasyon

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: RIFKI deposunu indir
        uses: actions/checkout@v4
        with:
          path: rifki_repo

      - name: XiaoZhi kaynak kodunu indir
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          path: xiaozhi

      - name: RIFKI v15.4 paketini ac
        shell: bash
        run: |
          python3 -m zipfile -e rifki_repo/RIFKI_3000_v15_4_Kaynak_Kontrolu.zip rifki_patch

      - name: Uyumlulugu kontrol et
        shell: bash
        run: |
          python3 rifki_patch/patch_xiaozhi.py --check xiaozhi

      - name: RIFKI yuz patchini uygula
        shell: bash
        run: |
          python3 rifki_patch/patch_xiaozhi.py xiaozhi

      - name: ESP32-S3 derle
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi
          idf.py set-target esp32s3
          idf.py build
      - name: Tek RIFKI firmware dosyasi olustur
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi
          idf.py merge-bin -o "$GITHUB_WORKSPACE/RIFKI_3000_v15_4_ESP32S3.bin" -f raw

      - name: Firmware dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: RIFKI_3000_v15_4_ESP32S3
          path: RIFKI_3000_v15_4_ESP32S3.bin
          if-no-files-found: error
