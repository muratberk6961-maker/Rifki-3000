name: RIFKI v15.6 + Zeka Katmani + XiaoZhi ESP32-S3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: RIFKI deposunu indir
        uses: actions/checkout@v4
        with:
          path: rifki_repo

      - name: XiaoZhi kaynak kodunu indir
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          path: xiaozhi

      - name: RIFKI v15.4 paketini ac
        shell: bash
        run: |
          python3 -m zipfile -e rifki_repo/RIFKI_3000_v15_4_Kaynak_Kontrolu.zip rifki_patch

      - name: RIFKI yuz uyumlulugunu kontrol et
        shell: bash
        run: |
          python3 rifki_patch/patch_xiaozhi.py --check xiaozhi

      - name: RIFKI yuz patchini uygula
        shell: bash
        run: |
          python3 rifki_patch/patch_xiaozhi.py xiaozhi

      - name: RIFKI v15.6 zeka katmanini bagla
        shell: bash
        run: |
          cp rifki_repo/rifki_behavior_engine.h xiaozhi/main/rifki_behavior_engine.h

          cat > /tmp/rifki_v156_patch.py <<'PY'
          from pathlib import Path

          p = Path("xiaozhi/main/application.cc")
          s = p.read_text(encoding="utf-8")

          # -------------------------------------------------
          # RIFKI davranis motoru include
          # -------------------------------------------------

          include_anchor = '#include "mcp_server.h"\n'
          rifki_include = '#include "rifki_behavior_engine.h"\n'

          if rifki_include not in s:
              if include_anchor not in s:
                  raise SystemExit("RIFKI_INCLUDE_ANCHOR_NOT_FOUND")

              s = s.replace(
                  include_anchor,
                  include_anchor + rifki_include,
                  1
              )

          # initializer_list icin gerekli
          std_anchor = '#include <algorithm>\n'
          std_include = '#include <initializer_list>\n'

          if std_include not in s:
              if std_anchor not in s:
                  raise SystemExit("RIFKI_STD_INCLUDE_ANCHOR_NOT_FOUND")

              s = s.replace(
                  std_anchor,
                  std_anchor + std_include,
                  1
              )

          # -------------------------------------------------
          # Yerel RIFKI metin analiz katmani
          # -------------------------------------------------

          tag_anchor = '#define TAG "Application"\n'
          helper_marker = 'static RifkiContext g_rifki_pending_context;'

          if helper_marker not in s:
              helper_lines = [
                  '',
                  'static RifkiContext g_rifki_pending_context;',
                  '',
                  'static std::string RifkiLowerAscii(std::string text) {',
                  '    for (char& c : text) {',
                  "        if (c >= 'A' && c <= 'Z') {",
                  "            c = static_cast<char>(c - 'A' + 'a');",
                  '        }',
                  '    }',
                  '    return text;',
                  '}',
                  '',
                  'static bool RifkiContainsAny(',
                  '    const std::string& text,',
                  '    std::initializer_list<const char*> words) {',
                  '',
                  '    for (const char* word : words) {',
                  '        if (text.find(word) != std::string::npos) {',
                  '            return true;',
                  '        }',
                  '    }',
                  '',
                  '    return false;',
                  '}',
                  '',
                  'static RifkiContext AnalyzeRifkiText(',
                  '    const std::string& raw) {',
                  '',
                  '    RifkiContext context;',
                  '    const std::string text = RifkiLowerAscii(raw);',
                  '',
                  '    const bool explaining_word = RifkiContainsAny(',
                  '        text,',
                  '        {" ne demek", " nedir", " anlami", " anlamı",',
                  '         " ornek", " örnek"});',
                  '',
                  '    const bool bad_word = RifkiContainsAny(',
                  '        text,',
                  '        {"aptal", "salak", "gerizekali", "gerizekalı"});',
                  '',
                  '    const bool aimed_at_rifki = RifkiContainsAny(',
                  '        text,',
                  '        {"sen ", "sana ", "seni ", "senin ",',
                  '         "rifki", "rıfkı"});',
                  '',
                  '    context.insult_or_swear =',
                  '        bad_word && aimed_at_rifki && !explaining_word;',
                  '',
                  '    context.direct_attack =',
                  '        context.insult_or_swear;',
                  '',
                  '    context.joke = RifkiContainsAny(',
                  '        text,',
                  '        {"saka", "şaka", "espri",',
                  '         "komik", "haha", "hehe"});',
                  '',
                  '    context.sad_topic = RifkiContainsAny(',
                  '        text,',
                  '        {"uzgun", "üzgün",',
                  '         "agladim", "ağladım",',
                  '         "moralim bozuk",',
                  '         "kotuyum", "kötüyüm"});',
                  '',
                  '    context.surprising = RifkiContainsAny(',
                  '        text,',
                  '        {"vay",',
                  '         "inanamiyorum", "inanamıyorum",',
                  '         "ciddi misin",',
                  '         "saka mi", "şaka mı"});',
                  '',
                  '    return context;',
                  '}',
                  '',
              ]

              if tag_anchor not in s:
                  raise SystemExit("RIFKI_TAG_ANCHOR_NOT_FOUND")

              s = s.replace(
                  tag_anchor,
                  tag_anchor + "\n".join(helper_lines),
                  1
              )

          # -------------------------------------------------
          # STT: Kullanici cumlesini yerel analiz et
          # -------------------------------------------------

          stt_marker = (
              '        } else if '
              '(strcmp(type->valuestring, "stt") == 0) {'
          )

          llm_marker = (
              '        } else if '
              '(strcmp(type->valuestring, "llm") == 0) {'
          )

          stt_start = s.find(stt_marker)

          if stt_start < 0:
              raise SystemExit("RIFKI_STT_ANCHOR_NOT_FOUND")

          stt_end = s.find(llm_marker, stt_start)

          if stt_end < 0:
              raise SystemExit("RIFKI_STT_END_NOT_FOUND")

          stt_section = s[stt_start:stt_end]

          analyze_call = (
              '                g_rifki_pending_context =\n'
              '                    AnalyzeRifkiText(text->valuestring);\n'
          )

          if 'AnalyzeRifkiText(text->valuestring);' not in stt_section:
              text_if_marker = (
                  '            if (cJSON_IsString(text)) {'
              )

              text_if = s.find(
                  text_if_marker,
                  stt_start,
                  stt_end
              )

              if text_if < 0:
                  raise SystemExit("RIFKI_STT_TEXT_NOT_FOUND")

              insert_at = text_if + len(text_if_marker)

              s = (
                  s[:insert_at]
                  + '\n'
                  + analyze_call
                  + s[insert_at:]
              )

          # -------------------------------------------------
          # LLM: Yerel analiz + sunucu RIFKI bilgisi
          # -------------------------------------------------

          llm_start = s.find(llm_marker)

          mcp_marker = (
              '        } else if '
              '(strcmp(type->valuestring, "mcp") == 0) {'
          )

          llm_end = s.find(mcp_marker, llm_start)

          if llm_start < 0 or llm_end < 0:
              raise SystemExit("RIFKI_LLM_ANCHOR_NOT_FOUND")

          new_llm_lines = [
              '        } else if (strcmp(type->valuestring, "llm") == 0) {',
              '            auto emotion =',
              '                cJSON_GetObjectItem(root, "emotion");',
              '',
              '            std::string emotion_str =',
              '                cJSON_IsString(emotion)',
              '                    ? std::string(emotion->valuestring)',
              '                    : "neutral";',
              '',
              '            RifkiContext context =',
              '                g_rifki_pending_context;',
              '',
              '            auto rifki =',
              '                cJSON_GetObjectItem(root, "rifki");',
              '',
              '            if (cJSON_IsObject(rifki)) {',
              '                auto read_bool =',
              '                    [rifki](',
              '                        const char* key,',
              '                        bool& target) {',
              '',
              '                        auto item =',
              '                            cJSON_GetObjectItem(',
              '                                rifki, key);',
              '',
              '                        if (cJSON_IsBool(item)) {',
              '                            target =',
              '                                cJSON_IsTrue(item);',
              '                        }',
              '                    };',
              '',
              '                read_bool(',
              '                    "insult_or_swear",',
              '                    context.insult_or_swear);',
              '',
              '                read_bool(',
              '                    "direct_attack",',
              '                    context.direct_attack);',
              '',
              '                read_bool(',
              '                    "joke",',
              '                    context.joke);',
              '',
              '                read_bool(',
              '                    "sad_topic",',
              '                    context.sad_topic);',
              '',
              '                read_bool(',
              '                    "surprising",',
              '                    context.surprising);',
              '',
              '                read_bool(',
              '                    "unknown_answer",',
              '                    context.unknown_answer);',
              '',
              '                read_bool(',
              '                    "needs_repeat",',
              '                    context.needs_repeat);',
              '',
              '                auto speaker =',
              '                    cJSON_GetObjectItem(',
              '                        rifki,',
              '                        "speaker_name");',
              '',
              '                if (cJSON_IsString(speaker)) {',
              '                    context.speaker_name =',
              '                        speaker->valuestring;',
              '                }',
              '            }',
              '',
              '            auto reaction =',
              '                ChooseRifkiReaction(context);',
              '',
              '            if (reaction.emotion_tag != "normal") {',
              '                emotion_str =',
              '                    reaction.emotion_tag;',
              '            }',
              '',
              '            ESP_LOGI(',
              '                TAG,',
              '                "RIFKI v15.6: speaker=%s emotion=%s",',
              '                AddressSpeaker(context).c_str(),',
              '                emotion_str.c_str());',
              '',
              '            g_rifki_pending_context =',
              '                RifkiContext{};',
              '',
              '            Schedule([display, emotion_str]() {',
              '                display->SetEmotion(',
              '                    emotion_str.c_str());',
              '            });',
          ]

          new_llm_block = (
              "\n".join(new_llm_lines)
              + "\n"
          )

          s = (
              s[:llm_start]
              + new_llm_block
              + s[llm_end:]
          )

          # -------------------------------------------------
          # Son kontrol
          # -------------------------------------------------

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("RIFKI_V15_6_PATCH_APPLIED")
          PY

          python3 /tmp/rifki_v156_patch.py

          grep -q 'AnalyzeRifkiText' xiaozhi/main/application.cc
          grep -q 'ChooseRifkiReaction' xiaozhi/main/application.cc
          grep -q 'g_rifki_pending_context' xiaozhi/main/application.cc

      - name: ESP32-S3 derle
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi
          idf.py set-target esp32s3
          idf.py build

      - name: Tek RIFKI v15.6 firmware dosyasi olustur
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi
          idf.py merge-bin \
            -o "$GITHUB_WORKSPACE/RIFKI_3000_v15_6_ESP32S3.bin" \
            -f raw

      - name: Firmware dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: RIFKI_3000_v15_6_ESP32S3
          path: RIFKI_3000_v15_6_ESP32S3.bin
          if-no-files-found: error
